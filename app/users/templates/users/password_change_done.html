{% extends "users/cabinet.html" %}
{% load i18n %}

{% block cabinet_content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 bg-white p-5 rounded custom-shadow text-center">

            <h2 class="mb-3">
                {% trans "Password updated" %}
            </h2>

            <p class="text-muted">
                {% trans "Your password has been changed successfully." %}
            </p>

            <a href="{% url 'users:profile' %}" class="btn btn-dark mt-3">
                {% trans "Back to profile" %}
            </a>

        </div>
    </div>
</div>
{% endblock %}
